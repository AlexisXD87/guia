<style>
/* Disposición: cabecera fija con dos pestañas; flashcards centradas en una columna; simulacro en dos columnas (lista de conceptos + lagunas) */
:root{
  --bg:#0a1115; --bg-2:#0e181d; --surface:#122029; --surface-2:#172a35; --line:#23394a; --line-soft:#1b2d38;
  --fg:#e3e8e7; --fg-dim:#a3b2b7; --fg-faint:#6f828a;
  --brass:#d6b26a; --brass-dim:#a98a4c; --on-brass:#171103;
  --ok:#6cc7a3; --ok-bg:#12302a; --bad:#e6735f; --bad-bg:#35201d; --omit:#8fa3ad; --omit-bg:#1a2a33;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 56px;min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--serif);font-size:1.45rem;font-weight:500;letter-spacing:.005em;line-height:1.1}
.brand span{font-family:var(--mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-faint)}
.tabs{display:flex;gap:4px;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r);padding:3px}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:4px;color:var(--fg-dim);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface-2);color:var(--brass)}
.tabs button:hover{color:var(--fg)}

main{padding-block:28px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint)}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:var(--r);font-weight:500;color:var(--fg);transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--brass-dim)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.primary:hover{background:#e2c07c}
.btn.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.btn.no{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.ghost{background:none}

/* Controles de filtro */
.filters{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lab{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint)}
select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;max-width:100%}
.check{display:flex;align-items:center;gap:8px;color:var(--fg-dim);font-size:.9rem;cursor:pointer}
.check input{accent-color:var(--brass);width:16px;height:16px}

/* Flashcards */
.flash{max-width:760px;margin:0 auto}
.stats{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;font-family:var(--mono);font-size:.78rem;color:var(--fg-dim);margin-bottom:8px}

.scene{perspective:1400px}
.card{display:grid;width:100%;text-align:left;background:none;border:0;padding:0;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:340px;
  background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:10px;

.face .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.face .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.face .hint{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--fg-faint);text-transform:uppercase}
.stmt,.sentence{font-family:var(--serif);font-size:clamp(1.2rem,2.6vw,1.5rem);line-height:1.5;margin:0}
.blank{display:inline-block;min-width:5.5ch;border-bottom:2px solid var(--brass);margin:0 .15em;transform:translateY(2px)}
mark.fill{background:none;color:var(--brass);border-bottom:2px solid var(--brass);padding:0 .1em;font-style:italic}
.answer{font-family:var(--serif);font-size:clamp(1.8rem,5vw,2.6rem);color:var(--brass);line-height:1.15;margin:0;font-style:italic}
.also{font-size:.85rem;color:var(--fg-dim)}

.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

.done{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:34px clamp(18px,4vw,40px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.done h2{font-size:1.9rem}
.done .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.empty{color:var(--fg-dim);text-align:center;padding:40px 0}

/* Simulacro: configuración */
.setup{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.setup h2{font-size:2rem}
.setup p.lead{margin:6px 0 0;color:var(--fg-dim);max-width:60ch}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.opt{display:block;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.opt b{display:block;font-weight:600;margin-bottom:2px}
.opt span{color:var(--fg-dim);font-size:.88rem}
.opt[aria-pressed="true"]{border-color:var(--brass);background:var(--surface-2)}
.opt[aria-pressed="true"] b{color:var(--brass)}
.row-fields{display:flex;flex-wrap:wrap;gap:16px 24px}
.note{border:1px solid var(--line-soft);background:var(--bg-2);border-radius:var(--r);padding:12px 14px;color:var(--fg-dim);font-size:.88rem}

/* Simulacro: examen */
.exambar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,62px));z-index:15;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);
  display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;padding:10px 14px;margin-bottom:18px}
.timer{font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.warn{color:var(--brass)}.timer.crit{color:var(--bad)}
.exambar .info{font-family:var(--mono);font-size:.78rem;color:var(--fg-dim)}
.exambar .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.examgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.examgrid.solo{grid-template-columns:minmax(0,1fr);max-width:820px;margin:0 auto}
.listpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,62px) + var(--bar,60px) + 12px);max-height:calc(100vh - var(--hdr,62px) - var(--bar,60px) - 40px);overflow:auto;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px}
.listpanel h3{font-size:1.05rem;margin-bottom:2px}
.listpanel p{margin:0 0 10px;font-size:.8rem;color:var(--fg-faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:5px 9px;font-size:.84rem;text-align:left;line-height:1.3}

.chip.used{opacity:.4;text-decoration:line-through;text-decoration-color:var(--fg-faint)}
.sheetbtn{display:none}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.q{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:14px 12px;border-radius:var(--r);border:1px solid transparent}
.q.active{background:var(--bg-2);border-color:var(--line)}
.q .num{font-family:var(--mono);font-size:.82rem;color:var(--fg-faint);padding-top:4px}
.q .stmt{font-size:1.12rem}
.q input.ans{display:inline-block;width:min(100%,24ch);min-width:15ch;margin:2px 3px;background:var(--surface);border:0;border-bottom:2px solid var(--brass-dim);border-radius:3px 3px 0 0;padding:3px 8px;font-family:var(--sans);font-size:.95rem;color:var(--brass);vertical-align:baseline}
.q input.ans:focus{outline:none;border-bottom-color:var(--brass);background:var(--surface-2)}
.q input.ans.filled{border-bottom-color:var(--brass)}
.q .clr{border:0;background:none;color:var(--fg-faint);padding:0 4px;font-size:1rem}
.q .clr:hover{color:var(--bad)}

/* Resultados */
.result{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.tile .n{font-family:var(--serif);font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-family:var(--mono);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-dim)}
.tile.ok .n{color:var(--ok)}.tile.bad .n{color:var(--bad)}.tile.omit .n{color:var(--omit)}.tile.grade .n{color:var(--brass)}
.headline{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between}
.headline h2{font-size:2rem}
.filt{display:flex;flex-wrap:wrap;gap:8px}
.filt button{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 14px;font-size:.85rem;color:var(--fg-dim)}
.filt button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:var(--surface)}
.items{display:flex;flex-direction:column;gap:14px;list-style:none;margin:0;padding:0}
.item{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px clamp(14px,3vw,22px);display:flex;flex-direction:column;gap:12px}
.item.s-ok{border-left:4px solid var(--ok)}.item.s-bad{border-left:4px solid var(--bad)}.item.s-omit{border-left:4px solid var(--omit)}
.item .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:3px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.omit{background:var(--omit-bg);color:var(--omit)}
.item .sentence{font-size:1.1rem}
.item .sentence .given{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px;font-style:italic}
.item .sentence .arrow{color:var(--fg-faint);font-family:var(--sans);font-size:.9em}
.item .sentence .right{color:var(--ok);font-style:italic;border-bottom:2px solid var(--ok)}
.fb{margin:0;color:var(--fg);font-size:.94rem}
.fb + .fb{margin-top:-4px}
.fb b{font-weight:600}
.fb .no{color:var(--bad)}.fb .yes{color:var(--ok)}
.src{font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;color:var(--fg-faint);text-transform:uppercase}

@media (max-width:860px){
  .top{position:static}
  .examgrid{grid-template-columns:minmax(0,1fr)}

  .sheetbtn{display:inline-flex;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:24;box-shadow:0 6px 24px #000a}

  .timer{font-size:1.3rem}

}

  .card{transition:none}
  .listpanel{transition:none}
}

<script>
/* Normalización y coincidencia tolerante a errores de ortografía */
function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g," ").trim().replace(/\s+/g," ");
}
function stripArt(s){ // quita artículos y "contrato de" iniciales
  let t=s;
  for(let i=0;i<3;i++){
    t=t.replace(/^(el|la|los|las|un|una|del|de la|de los|de las|contrato de|contrato del|contratos de|contratos)\s+/,"");
  }
  return t;
}
function osa(a,b){ // Damerau-Levenshtein (transposición adyacente cuenta 1)
  const n=a.length,m=b.length; if(!n) return m; if(!m) return n;
  const d=[]; for(let i=0;i<=n;i++){d.push(new Array(m+1).fill(0)); d[i][0]=i;}
  for(let j=0;j<=m;j++) d[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++){
    const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[n][m];
}
function tol(len){ return len<=4?0: len<=8?1: len<=13?2: 3; }
function formsOf(c){
  const set=new Set();
  [c.name,...(c.alias||[])].forEach(x=>{const n=norm(x); if(n){set.add(n); const t=stripArt(n); if(t) set.add(t);}});
  return [...set];
}
/* Devuelve {concept, dist, exact} del concepto más cercano a lo escrito, o null */
function resolve(input, bank, tolerant){
  const raw=norm(input); if(!raw) return null;
  const variants=[...new Set([raw, stripArt(raw)])].filter(Boolean);
  let best=null, second=Infinity;
  for(const c of bank){
    let cd=Infinity, cl=0;
    for(const f of c._forms){
      for(const v of variants){
        const dd=(v===f)?0:osa(v,f);
        if(dd<cd){cd=dd; cl=f.length;}
      }
    }
    const lim=tolerant?tol(cl):0;
    if(cd<=lim){
      if(!best||cd<best.dist){ if(best) second=Math.min(second,best.dist); best={concept:c,dist:cd,exact:cd===0}; }
      else second=Math.min(second,cd);
    }
  }
  if(best && second===best.dist && best.dist>0) return null; // empate ambiguo
  return best;
}

/* ===== Utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS="lagunas-v1:";
const lsGet=(k,d)=>{try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const byId={};B.forEach(c=>{c._forms=formsOf(c);byId[c.id]=c});
const CARDS=B.flatMap(c=>c.lag.map((t,i)=>({key:c.id+"#"+i,c,t,i})));
const TEMA={O:"Obligaciones",C:"Contratos"};
const GRUPOS=[...new Set(B.map(c=>c.grupo))];
const srcOf=c=>/^Diap/.test(c.sl)?"Presentación · "+c.sl:"Cuestionario del curso";
const withBlank=(t,html)=>{const[a,b]=t.split("____");return esc(a)+html+esc(b)};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtTime=ms=>{const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function measure(){const h=$(".top");if(h)document.documentElement.style.setProperty("--hdr",(getComputedStyle(h).position==="sticky"?h.offsetHeight:0)+"px");const b=$(".exambar");if(b)document.documentElement.style.setProperty("--bar",b.offsetHeight+"px")}
addEventListener("resize",measure);

const views={flashcards:$("#view-flash"),simulacro:$("#view-sim")};
function showTab(name,push){
  if(!views[name])name="flashcards";
  Object.entries(views).forEach(([k,el])=>el.hidden=k!==name);
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===name)));
  if(push){try{history.replaceState(null,"","#"+name)}catch(e){}}
  measure();
}

const F={opts:Object.assign({tema:"todos",grupo:"todos",filtro:"todas",azar:false,auto:true},lsGet("fopts",{})),marks:lsGet("marks",{}),deck:[],idx:0,flipped:false,finished:false,confirmReset:false};
function buildDeck(keepKeys){
  let d=CARDS.filter(x=>(F.opts.tema==="todos"||x.c.tema===F.opts.tema)&&(F.opts.grupo==="todos"||x.c.grupo===F.opts.grupo));
  if(F.opts.filtro==="pendientes")d=d.filter(x=>F.marks[x.key]!=="ok");
  if(F.opts.filtro==="falladas")d=d.filter(x=>F.marks[x.key]==="no");
  F.deck=F.opts.azar?shuffle(d):d;F.idx=0;F.flipped=false;F.finished=false;
}
function renderFlash(){
  const root=$("#flash-root");
  const o=F.opts;
  const grupos=GRUPOS.filter(g=>o.tema==="todos"||B.some(c=>c.grupo===g&&c.tema===o.tema));
  if(o.grupo!=="todos"&&!grupos.includes(o.grupo))o.grupo="todos";
  const filters=`<div class="filters">
    <div class="field"><label for="f-tema">Tema</label><select id="f-tema"><option value="todos">Todos</option><option value="O">Obligaciones</option><option value="C">Contratos</option></select></div>
    <div class="field"><label for="f-grupo">Subtema</label><select id="f-grupo"><option value="todos">Todos los subtemas</option>${grupos.map(g=>`<option>${esc(g)}</option>`).join("")}</select></div>
    <div class="field"><label for="f-filtro">Mostrar</label><select id="f-filtro"><option value="todas">Todas las tarjetas</option><option value="pendientes">Pendientes y falladas</option><option value="falladas">Solo falladas</option></select></div>
    <label class="check"><input type="checkbox" id="f-azar"> Orden aleatorio</label>
    <label class="check"><input type="checkbox" id="f-auto"> Pasar a la siguiente al marcar</label>
  </div>`;
  const total=F.deck.length;
  const ok=F.deck.filter(x=>F.marks[x.key]==="ok").length,no=F.deck.filter(x=>F.marks[x.key]==="no").length,pend=total-ok-no;
  let body="";
  if(!total){
    body=`<div class="empty">No hay tarjetas con estos filtros.${o.filtro==="falladas"?" Aún no has marcado ninguna como fallada.":""}</div>`;
  }else if(F.finished){
    body=`<div class="done"><span class="eyebrow">Mazo terminado</span><h2>${ok} acertadas, ${no} falladas${pend?`, ${pend} sin marcar`:""}</h2>
      <div class="row">${no?`<button class="btn primary" id="d-falladas">Repasar las falladas</button>`:""}<button class="btn" id="d-again">Volver a empezar</button></div></div>`;
  }else{
    const x=F.deck[F.idx],m=F.marks[x.key];
    const badge=m?`<span class="mark-badge ${m}">${m==="ok"?"Acertada":"Fallada"}</span>`:"";
    body=`<div class="stats"><span>Tarjeta ${F.idx+1} de ${total}</span><span><span class="ok">${ok} acertadas</span> · <span class="no">${no} falladas</span> · ${pend} pendientes</span></div>
    <div class="bar" aria-hidden="true"><i class="b-ok" style="width:${ok/total*100}%"></i><i class="b-no" style="width:${no/total*100}%"></i></div>
    <div class="scene"><button class="card${F.flipped?" flipped":""}" id="card" aria-label="Tarjeta: toca para ${F.flipped?"ver la laguna":"ver el concepto"}">
      <div class="face front" ${F.flipped?'aria-hidden="true"':""}>
        <div class="meta"><span class="eyebrow">Laguna · ${esc(x.c.grupo)}</span>${badge}</div>
        <div class="body"><p class="stmt">${withBlank(x.t,'<span class="blank"></span>')}</p></div>
        <div class="hint">Toca para ver el concepto</div></div>
      <div class="face back" ${F.flipped?"":'aria-hidden="true"'}>
        <div class="meta"><span class="eyebrow">Concepto · ${esc(TEMA[x.c.tema])}</span>${badge}</div>
        <div class="body"><p class="answer">${esc(x.c.name)}</p>
          <p class="sentence">${withBlank(x.t,`<mark class="fill">${esc(x.c.name)}</mark>`)}</p>
          </div>
        <div class="hint">${esc(srcOf(x.c))}</div></div>
    </button></div>
    <div class="nav marks"><button class="btn no" id="m-no" ${F.flipped?"":"disabled"}>No la acerté</button><button class="btn ok" id="m-ok" ${F.flipped?"":"disabled"}>La acerté</button></div>
    <div class="nav"><button class="btn" id="n-prev" ${F.idx===0?"disabled":""}>← Regresar</button><button class="btn primary" id="n-next">${F.idx===total-1?"Terminar":"Siguiente →"}</button></div>
    <div class="keys">← → navegar · espacio voltear</div>`;
  }
  root.innerHTML=filters+body+`<div style="margin-top:22px;text-align:center">${F.confirmReset?`<span class="also">¿Borrar todas las marcas? </span><button class="btn small no" id="r-yes">Sí, borrar</button> <button class="btn small ghost" id="r-no">Cancelar</button>`:`<button class="btn small ghost" id="r-ask">Reiniciar progreso</button>`}</div>`;
  $("#f-tema").value=o.tema;$("#f-grupo").value=o.grupo;$("#f-filtro").value=o.filtro;$("#f-azar").checked=o.azar;$("#f-auto").checked=o.auto;
  const on=(id,ev,fn)=>{const e=$(id);if(e)e.addEventListener(ev,fn)};
  const reopts=()=>{lsSet("fopts",F.opts);buildDeck();renderFlash()};
  on("#f-tema","change",e=>{o.tema=e.target.value;o.grupo="todos";reopts()});
  on("#f-grupo","change",e=>{o.grupo=e.target.value;reopts()});
  on("#f-filtro","change",e=>{o.filtro=e.target.value;reopts()});
  on("#f-azar","change",e=>{o.azar=e.target.checked;reopts()});
  on("#f-auto","change",e=>{o.auto=e.target.checked;lsSet("fopts",o)});
  on("#card","click",flip);
  on("#n-prev","click",prev);on("#n-next","click",next);
  on("#m-ok","click",()=>mark("ok"));on("#m-no","click",()=>mark("no"));
  on("#d-again","click",()=>{buildDeck();renderFlash()});
  on("#d-falladas","click",()=>{o.filtro="falladas";reopts()});
  on("#r-ask","click",()=>{F.confirmReset=true;renderFlash()});
  on("#r-no","click",()=>{F.confirmReset=false;renderFlash()});
  on("#r-yes","click",()=>{F.marks={};lsSet("marks",F.marks);F.confirmReset=false;buildDeck();renderFlash()});
}
function flip(){if(!F.deck.length||F.finished)return;F.flipped=!F.flipped;const c=$("#card");if(!c)return;c.classList.toggle("flipped",F.flipped);
  c.querySelector(".front").toggleAttribute("aria-hidden",F.flipped);c.querySelector(".back").toggleAttribute("aria-hidden",!F.flipped);
  $("#m-ok").disabled=!F.flipped;$("#m-no").disabled=!F.flipped;}
function go(i){F.idx=i;F.flipped=false;renderFlash()}
function prev(){if(F.idx>0)go(F.idx-1)}
function next(){if(F.idx<F.deck.length-1)go(F.idx+1);else{F.finished=true;F.flipped=false;renderFlash()}}
function mark(v){const x=F.deck[F.idx];if(!x)return;F.marks[x.key]=v;lsSet("marks",F.marks);
  if(F.opts.auto){if(F.opts.filtro==="falladas"&&v==="ok"){/* sigue en el mazo hasta terminarlo */}next()}else renderFlash()}
document.addEventListener("keydown",e=>{
  if(views.flashcards.hidden||/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||"")))return;
  if(e.key==="ArrowRight"){e.preventDefault();if(!F.finished&&F.deck.length)next()}
  else if(e.key==="ArrowLeft"){e.preventDefault();prev()}
  else if((e.key===" "||e.key==="Enter")&&e.target.tagName!=="BUTTON"){e.preventDefault();flip()}
});

const S={cfg:Object.assign({modo:"normal",tema:"todos",n:30,min:40,tol:true},lsGet("scfg",{})),exam:null,res:null,filtro:"todas",confirm:false,timer:null};
function pickExam(){
  const cfg=S.cfg;
  const pool=shuffle(CARDS.filter(x=>cfg.tema==="todos"||x.c.tema===cfg.tema));
  const seen=new Set(),items=[];
  for(const x of pool){if(items.length>=cfg.n)break;if(seen.has(x.c.id))continue;seen.add(x.c.id);items.push({key:x.key,c:x.c,t:x.t,ans:""})}
  let list=[];
  if(cfg.modo==="normal"){
    const chosen=new Set(items.map(i=>i.c.id));
    const extra=Math.max(3,Math.ceil(items.length/3));
    const rest=B.filter(c=>!chosen.has(c.id)&&(cfg.tema==="todos"||c.tema===cfg.tema));
    const extras=[];
    let guard=0;
    while(extras.length<extra&&rest.length&&guard++<500){
      const base=items[Math.floor(Math.random()*items.length)].c;
      const near=rest.filter(c=>c.grupo===base.grupo&&!extras.includes(c));
      const pickFrom=near.length?near:rest.filter(c=>!extras.includes(c));
      if(!pickFrom.length)break;
      extras.push(pickFrom[Math.floor(Math.random()*pickFrom.length)]);
    }
    list=[...items.map(i=>i.c),...extras].sort((a,b)=>norm(a.name).localeCompare(norm(b.name),"es"));
  }
  return{items,list,modo:cfg.modo,tol:cfg.tol,active:0,start:Date.now(),dur:cfg.min*60000};
}
function renderSim(){
  const root=$("#sim-root");
  clearInterval(S.timer);
  if(S.exam&&!S.res)renderExam(root);
  else if(S.res)renderResult(root);
  else renderSetup(root);
  measure();
}
function renderSetup(root){
  const c=S.cfg;
  root.innerHTML=`<div class="setup">
    <div><span class="eyebrow">Simulacro de examen</span><h2>Llena las lagunas</h2>
    <p class="lead">Cada examen toma lagunas al azar de un banco de ${CARDS.length} (${B.length} conceptos). Al terminar, cada respuesta lleva su retroalimentación con base en la presentación.</p></div>
    <div class="field"><span class="lab">Modo</span><div class="seg">
      <button class="opt" data-modo="normal" aria-pressed="${c.modo==="normal"}"><b>Normal · con lista de conceptos</b><span>Hay más conceptos en la lista que lagunas. Toca uno o escríbelo.</span></button>
      <button class="opt" data-modo="dificil" aria-pressed="${c.modo==="dificil"}"><b>Difícil · sin lista</b><span>Escribes el concepto de memoria.</span></button></div></div>
    <div class="row-fields">
      <div class="field"><label for="s-tema">Tema</label><select id="s-tema"><option value="todos">Obligaciones y Contratos</option><option value="O">Solo Obligaciones</option><option value="C">Solo Contratos</option></select></div>
      <div class="field"><label for="s-n">Lagunas</label><select id="s-n">${[10,20,30,40].map(n=>`<option value="${n}">${n}</option>`).join("")}</select></div>
      <div class="field"><label for="s-min">Tiempo</label><select id="s-min">${[15,25,40,60,90].map(n=>`<option value="${n}">${n} minutos</option>`).join("")}</select></div>
    </div>
    <label class="check"><input type="checkbox" id="s-tol"> Tolerar errores de ortografía al calificar</label>
    <div class="note">Se ignoran mayúsculas, acentos y artículos. Con la tolerancia activa también se aceptan letras de más, de menos o intercambiadas (por ejemplo «subrogasion» o «rescicion»), siempre que lo escrito no se parezca más a otro concepto. Si aceptamos una respuesta con error, te lo indicamos en la retroalimentación.</div>
    <div><button class="btn primary" id="s-go">Comenzar simulacro</button></div></div>`;
  $("#s-tema").value=c.tema;$("#s-n").value=String(c.n);$("#s-min").value=String(c.min);$("#s-tol").checked=c.tol;
  root.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{c.modo=b.dataset.modo;lsSet("scfg",c);renderSetup(root)}));
  $("#s-tema").onchange=e=>{c.tema=e.target.value;lsSet("scfg",c)};
  $("#s-n").onchange=e=>{c.n=+e.target.value;c.min=Math.round(c.n*1.35/5)*5||15;$("#s-min").value=String([15,25,40,60,90].includes(c.min)?c.min:40);c.min=+$("#s-min").value;lsSet("scfg",c)};
  $("#s-min").onchange=e=>{c.min=+e.target.value;lsSet("scfg",c)};
  $("#s-tol").onchange=e=>{c.tol=e.target.checked;lsSet("scfg",c)};
  $("#s-go").onclick=()=>{S.exam=pickExam();S.res=null;S.confirm=false;S.filtro="todas";renderSim();window.scrollTo(0,0)};
}
function answered(){return S.exam.items.filter(i=>i.ans.trim()).length}
function renderExam(root){
  const E=S.exam,normal=E.modo==="normal";
  const qs=E.items.map((it,i)=>`<li class="q${i===E.active?" active":""}" id="q-${i}"><span class="num">${i+1}.</span>
    <p class="stmt">${withBlank(it.t,`<input class="ans" id="a-${i}" data-i="${i}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Laguna ${i+1}" value="${esc(it.ans)}"><button class="clr" data-clr="${i}" aria-label="Borrar respuesta ${i+1}" ${it.ans?"":"hidden"}>×</button>`)}</p></li>`).join("");
  const panel=normal?`<aside class="listpanel" id="listpanel" aria-label="Lista de conceptos"><h3>Lista de conceptos</h3><p>${E.list.length} conceptos para ${E.items.length} lagunas. Toca uno para llenar la laguna activa.</p><div class="chips">${E.list.map(c=>`<button class="chip" data-c="${c.id}">${esc(c.name)}</button>`).join("")}</div></aside>`:"";
  root.innerHTML=`<div class="exambar"><span class="timer" id="timer" role="timer">--:--</span><span class="info" id="prog"></span>
    <div class="acts" id="acts"></div></div>
    <div class="examgrid${normal?"":" solo"}">${panel}<ol class="qs">${qs}</ol></div>
    ${normal?`<button class="btn primary sheetbtn" id="sheetbtn">Conceptos</button>`:""}`;
  const refresh=()=>{
    $("#prog").textContent=`${answered()} de ${E.items.length} contestadas`;
    const used=new Set(E.items.map(i=>norm(i.ans)));
    root.querySelectorAll(".chip").forEach(ch=>ch.classList.toggle("used",used.has(norm(byId[ch.dataset.c].name))));
    $("#acts").innerHTML=S.confirm?`<span class="info">${E.items.length-answered()?`Quedan ${E.items.length-answered()} sin contestar. `:""}¿Entregar?</span><button class="btn small primary" id="fin-yes">Entregar</button><button class="btn small ghost" id="fin-no">Seguir</button>`:`<button class="btn small" id="fin">Terminar examen</button>`;
    const y=$("#fin-yes"),n=$("#fin-no"),f=$("#fin");
    if(y)y.onclick=()=>finish("entregado");if(n)n.onclick=()=>{S.confirm=false;refresh()};if(f)f.onclick=()=>{S.confirm=true;refresh()};
    measure();
  };
  const setActive=i=>{E.active=i;root.querySelectorAll(".q").forEach((q,k)=>q.classList.toggle("active",k===i))};
  root.querySelectorAll("input.ans").forEach(inp=>{
    const i=+inp.dataset.i;
    inp.addEventListener("focus",()=>setActive(i));
    inp.addEventListener("input",()=>{E.items[i].ans=inp.value;inp.classList.toggle("filled",!!inp.value.trim());root.querySelector(`[data-clr="${i}"]`).hidden=!inp.value;refresh()});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const nx=$("#a-"+(i+1));if(nx)nx.focus()}});
    inp.classList.toggle("filled",!!inp.value.trim());
  });
  root.querySelectorAll(".clr").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.clr;E.items[i].ans="";const inp=$("#a-"+i);inp.value="";inp.focus();b.hidden=true;inp.classList.remove("filled");refresh()}));
  root.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    const i=E.active;
    const c=byId[ch.dataset.c];E.items[i].ans=c.name;const inp=$("#a-"+i);inp.value=c.name;inp.classList.add("filled");root.querySelector(`[data-clr="${i}"]`).hidden=false;
    const nx=E.items.findIndex((x,k)=>k>i&&!x.ans.trim());setActive(nx>=0?nx:i);
    const q=$("#q-"+(nx>=0?nx:i));if(q&&q.getBoundingClientRect().bottom>innerHeight-80||q.getBoundingClientRect().top<150)q.scrollIntoView({block:"center",behavior:"smooth"});
    refresh();
  }));
  const sb=$("#sheetbtn");if(sb)sb.onclick=()=>{const p=$("#listpanel");const open=p.classList.toggle("open");sb.textContent=open?"Cerrar lista":"Conceptos"};
  const tick=()=>{const left=E.start+E.dur-Date.now();const t=$("#timer");if(!t)return;t.textContent=fmtTime(left);t.className="timer"+(left<=60000?" crit":left<=300000?" warn":"");if(left<=0)finish("tiempo")};
  refresh();tick();S.timer=setInterval(tick,250);
  setActive(E.active);measure();
}
function grade(E){
  return E.items.map((it,i)=>{
    const raw=it.ans.trim();
    if(!raw)return{i,it,st:"omit"};
    const r=resolve(raw,B,E.tol);
    if(r&&r.concept.id===it.c.id)return{i,it,st:"ok",raw,fuzzy:r.dist>0,canon:it.c.name};
    if(!E.tol){ // sin tolerancia: lo escrito no coincide exactamente; busca si es otro concepto
      const r2=resolve(raw,B,false);return{i,it,st:"bad",raw,other:r2&&r2.concept};
    }
    return{i,it,st:"bad",raw,other:r?r.concept:null};
  });
}
function finish(why){
  if(!S.exam)return;
  clearInterval(S.timer);
  const E=S.exam,rs=grade(E);
  S.res={rs,why,used:Math.min(Date.now()-E.start,E.dur),dur:E.dur,modo:E.modo,tol:E.tol};
  S.confirm=false;renderSim();window.scrollTo(0,0);
}
const aD=d=>/^el /.test(d)?"al "+d.slice(3):"a "+d;
function feedback(r){
  const c=r.it.c;
  if(r.st==="ok"){
    let h=`<p class="fb"><b class="yes">Correcto.</b> «${esc(c.name)}» corresponde ${esc(aD(c.d))}.</p>`;
    if(r.fuzzy)h+=`<p class="fb">Aceptamos «${esc(r.raw)}» aunque tiene un error de ortografía; se escribe <b>${esc(c.name)}</b>.</p>`;
    return h;
  }
  if(r.st==="omit")return `<p class="fb"><b>Sin contestar.</b> La respuesta era «${esc(c.name)}», porque corresponde ${esc(aD(c.d))}.</p>`;
  if(r.other){
    const o=r.other;
    return `<p class="fb"><b class="no">Error.</b> «${esc(o.name)}» no es, porque designa ${esc(o.d)}.</p>
    <p class="fb"><b class="yes">La correcta es «${esc(c.name)}»</b>, porque la frase describe ${esc(c.d)}.</p>`;
  }
  return `<p class="fb"><b class="no">Error.</b> «${esc(r.raw)}» no corresponde a ningún concepto del temario que encaje con esta frase${S.res&&!S.res.tol?" (la tolerancia ortográfica estaba desactivada)":""}.</p>
    <p class="fb"><b class="yes">La correcta es «${esc(c.name)}»</b>, porque la frase describe ${esc(c.d)}.</p>`;
}
function renderResult(root){
  const R=S.res,rs=R.rs,N=rs.length;
  const ok=rs.filter(r=>r.st==="ok").length,bad=rs.filter(r=>r.st==="bad").length,om=rs.filter(r=>r.st==="omit").length;
  const g=(ok/N*10);
  const gt=Number.isInteger(g)?String(g):g.toFixed(1);
  const show=rs.filter(r=>S.filtro==="todas"||(S.filtro==="ok"&&r.st==="ok")||(S.filtro==="bad"&&r.st==="bad")||(S.filtro==="omit"&&r.st==="omit"));
  const stLabel={ok:["ok","Correcta"],bad:["bad","Incorrecta"],omit:["omit","Omitida"]};
  const items=show.map(r=>{
    const c=r.it.c;const cls=r.st==="ok"?"ok":r.st==="bad"?"bad":"omit";
    let fill;
    if(r.st==="ok")fill=`<span class="right">${esc(c.name)}</span>`;
    else if(r.st==="bad")fill=`<span class="given">${esc(r.raw)}</span><span class="arrow"> → </span><span class="right">${esc(c.name)}</span>`;
    else fill=`<span class="right">${esc(c.name)}</span>`;
    return `<li class="item s-${cls}"><div class="hd"><span class="eyebrow">Laguna ${r.i+1} · ${esc(c.grupo)}</span><span class="tag ${stLabel[r.st][0]}">${stLabel[r.st][1]}</span></div>
      <p class="sentence">${withBlank(r.it.t,fill)}</p>${feedback(r)}<span class="src">${esc(srcOf(c))}</span></li>`;
  }).join("");
  const fails=bad+om;
  root.innerHTML=`<div class="result">
    <div class="headline"><div><span class="eyebrow">Resultado · modo ${R.modo==="normal"?"normal":"difícil"}${R.why==="tiempo"?" · se acabó el tiempo":""}</span><h2>${ok} de ${N} lagunas correctas</h2></div>
      <span class="eyebrow">Tiempo usado ${fmtTime(R.used)} de ${fmtTime(R.dur)}</span></div>
    <div class="score"><div class="tile ok"><span class="n">${ok}</span><span class="l">Correctas</span></div><div class="tile bad"><span class="n">${bad}</span><span class="l">Incorrectas</span></div><div class="tile omit"><span class="n">${om}</span><span class="l">Omitidas</span></div><div class="tile grade"><span class="n">${gt}</span><span class="l">Calificación sobre 10</span></div></div>
    <div class="bar" aria-hidden="true"><i class="b-ok" style="width:${ok/N*100}%"></i><i class="b-no" style="width:${bad/N*100}%"></i></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px"><button class="btn primary" id="r-again">Otro simulacro</button><button class="btn" id="r-cfg">Cambiar configuración</button>${fails?`<button class="btn" id="r-study">Estudiar las ${fails} falladas en flashcards</button>`:""}</div>
    <div class="filt" role="group" aria-label="Filtrar retroalimentación">${[["todas","Todas ("+N+")"],["bad","Incorrectas ("+bad+")"],["omit","Omitidas ("+om+")"],["ok","Correctas ("+ok+")"]].map(([k,l])=>`<button data-f="${k}" aria-pressed="${S.filtro===k}">${l}</button>`).join("")}</div>
    <ol class="items">${items||'<li class="empty">No hay lagunas en esta categoría.</li>'}</ol></div>`;
  root.querySelectorAll(".filt button").forEach(b=>b.onclick=()=>{S.filtro=b.dataset.f;renderResult(root);measure()});
  $("#r-again").onclick=()=>{S.exam=pickExam();S.res=null;S.filtro="todas";renderSim();window.scrollTo(0,0)};
  $("#r-cfg").onclick=()=>{S.exam=null;S.res=null;renderSim();window.scrollTo(0,0)};
  const st=$("#r-study");if(st)st.onclick=()=>{
    rs.filter(r=>r.st!=="ok").forEach(r=>{F.marks[r.it.key]="no"});lsSet("marks",F.marks);
    F.opts.filtro="falladas";F.opts.tema="todos";F.opts.grupo="todos";lsSet("fopts",F.opts);buildDeck();renderFlash();showTab("flashcards",true);window.scrollTo(0,0);
  };
}

/* ===== Arranque ===== */
buildDeck();renderFlash();renderSim();
showTab((location.hash||"").replace("#","")==="simulacro"?"simulacro":"flashcards",false);
requestAnimationFrame(measure);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);

</script>

</body></html>
